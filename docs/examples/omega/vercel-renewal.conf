# Drop-in for soph-omega-renewal@<network>.service, after Vercel rehearsal.
# /etc/soph/omega-vercel.env is root-owned mode 0600 and contains VERCEL_TOKEN.
# For disposable rehearsals, append --disposable to ExecStart.
[Service]
EnvironmentFile=/etc/soph/omega-vercel.env
ExecStart=
ExecStart=/usr/local/bin/soph --json --timeout 5m omega publish --home /srv/omega-online --network %i --renew --vercel-config /etc/soph/omega-vercel.json
TimeoutStartSec=330
