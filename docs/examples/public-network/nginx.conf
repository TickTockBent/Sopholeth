# The host's cloudflared forwards to 127.0.0.1:18080. No TLS keys live here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_conn_zone $server_name zone=soph_requests:1m;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        client_header_buffer_size 1k;
        large_client_header_buffers 2 8k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 15s;
        keepalive_timeout 10s;
        limit_conn soph_requests 64;
        limit_conn_status 503;

        # Docker DNS follows node recreation without retaining an old IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $soph_backend node:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # cloudflared is the sole host ingress. Discard client-supplied XFF.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # Preserve the original URI: no rewrite, redirect, or proxy_pass suffix.
        location /v1/data/ { proxy_pass http://$soph_backend; }
        location ~ ^/v1/(health|status|topology|keys|bootstrap|gossip/message)$ {
            proxy_pass http://$soph_backend;
        }
        # WS, stream, metrics, dashboard, and unknown paths are not public yet.
        location / { return 404; }
    }
}
