# Node metrics for the local Compose cluster.
# Change targets to the observer-reachable HTTP endpoints for your run.
# Compose deliberately uses two enclaves; use one enclave for replication tests.
scrape_configs:
  - job_name: node_burnin
    metrics_path: /v1/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:8091
          - localhost:8092
          - localhost:8093
        labels:
          cluster: burnin
          impl: go

# k6 can separately push driver metrics through Prometheus remote-write.
# Configure the receiver and K6_PROMETHEUS_RW_SERVER_URL for your observer.
