services:
  node1:
    build: .
    ports:
      - "8091:8080"
    environment:
      - NODE_ID=node1
      - NODE_ADDRESS=node1
      - NODE_HTTP_PORT=8080
      - NODE_GOSSIP_PORT=9090
      - NODE_NETWORK=private
      - NODE_PEERS=node2:8080,node3:8080
      - NODE_REPLICATION=3
      - NODE_ENCLAVE=enclave-a
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cluster

  node2:
    build: .
    ports:
      - "8092:8080"
    environment:
      - NODE_ID=node2
      - NODE_ADDRESS=node2
      - NODE_HTTP_PORT=8080
      - NODE_GOSSIP_PORT=9090
      - NODE_NETWORK=private
      - NODE_PEERS=node1:8080,node3:8080
      - NODE_REPLICATION=3
      - NODE_ENCLAVE=enclave-a
    depends_on:
      node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cluster

  node3:
    build: .
    ports:
      - "8093:8080"
    environment:
      - NODE_ID=node3
      - NODE_ADDRESS=node3
      - NODE_HTTP_PORT=8080
      - NODE_GOSSIP_PORT=9090
      - NODE_NETWORK=private
      - NODE_PEERS=node1:8080,node2:8080
      - NODE_REPLICATION=3
      - NODE_ENCLAVE=enclave-b
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cluster

networks:
  cluster:
    driver: bridge
