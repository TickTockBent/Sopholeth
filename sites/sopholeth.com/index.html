<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sopholeth // wisdom through intentional forgetting</title>
  <meta name="description" content="Temporary shared state with mandatory lifetimes. Sopholeth: SOF-oh-leth." />
  <link rel="canonical" href="https://sopholeth.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sopholeth — Wisdom through intentional forgetting" />
  <meta property="og:description" content="A distributed network for temporary shared state. Wisdom through intentional forgetting." />
  <meta property="og:site_name" content="Sopholeth" />
  <meta property="og:url" content="https://sopholeth.com/" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary" />
  <meta property="twitter:title" content="Sopholeth — Wisdom through intentional forgetting" />
  <meta property="twitter:description" content="A distributed network for temporary shared state. Wisdom through intentional forgetting." />

  <meta name="keywords" content="ephemeral storage, AI agents, MCP, distributed systems, agent coordination, key-value store, temporary data" />
  <meta name="author" content="Sopholeth Project" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0a0f" />

  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0f'/><text x='50' y='68' font-family='monospace' font-weight='700' font-size='56' text-anchor='middle' fill='%2339ff14'>S</text></svg>" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #0a0a0f;
      color: var(--color-text-body);
      font-family: var(--font-mono);
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Background layers ---------- */
    .bg-layer {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-matrix-wrap {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-scanlines::after {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        #00000020 3px, #00000020 4px
      );
    }
    .bg-vignette {
      background: radial-gradient(
        ellipse at center,
        transparent 40%,
        #0a0a0f 100%
      );
      z-index: 1;
    }

    main#app-root {
      position: relative;
      z-index: 3;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 28px 60px;
    }

    @keyframes cursor-blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50%      { opacity: 1;   transform: scale(1.1); }
    }

    ::selection { background: #39ff1480; color: #0a0a0f; }

    /* Smooth scroll for anchor nav */
    html { scroll-behavior: smooth; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: #22d3ee33; }
    ::-webkit-scrollbar-thumb:hover { background: #22d3ee66; }

    /* Headings default for any stray h1 etc */
    h1, h2, h3, h4 { color: #39ff14; font-family: var(--font-mono); margin: 0; }

    a { color: #39ff14; text-decoration: none; transition: color .2s, text-shadow .2s; }
    a:hover { color: #e040fb; text-shadow: 0 0 8px #e040fb99; }

    /* responsive grid fallbacks */
    .two-column-grid > *, .api-row > * { min-width: 0; }
    .api-row > * { overflow-wrap: anywhere; }
    @media (max-width: 720px) {
      .nav-section-link, .nav-status { display: none; }
      .two-column-grid { grid-template-columns: minmax(0, 1fr) !important; }
      .api-row { grid-template-columns: 70px minmax(0, 1fr) !important; }
      .api-row > :nth-child(3), .api-row > :nth-child(4) { grid-column: 1 / -1; padding-left: 70px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- background stack -->
  <div class="bg-matrix-wrap" id="matrix-root"></div>
  <div class="bg-layer bg-vignette"></div>
  <div class="bg-layer bg-scanlines"></div>

  <div id="site-nav-root" style="position: relative; z-index: 10;"></div>
  <main id="app-root"></main>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Component library -->
  <script type="text/babel" src="MatrixRain.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <SiteNav />
          <Hero />
          <WhatItIs />
          <Architecture />
          <Patterns />
          <TTLDemo />
          <Quickstart />
          <ApiReference />
          <Footer />
          <MatrixMount />
        </>
      );
    }

    function MatrixMount() {
      React.useEffect(() => {
        const host = document.getElementById('matrix-root');
        if (!host) return;
        const mountNode = document.createElement('div');
        mountNode.style.cssText = 'position:absolute;inset:0;';
        host.appendChild(mountNode);
        const root = ReactDOM.createRoot(mountNode);
        root.render(<MatrixRain />);
        return () => {
          root.unmount();
          host.removeChild(mountNode);
        };
      }, []);
      return null;
    }

    ReactDOM.createRoot(document.getElementById('app-root')).render(<App />);
  </script>

  <!-- Vercel Web Analytics: bot-filtered human counter, so site traffic is
       measured in the same units as the other sites (Cloudflare's proxied-zone
       "unique visitors" counts every scanner and crawler; this counts browsers
       that actually run the page). No-op until Web Analytics is enabled on the
       Vercel project. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
